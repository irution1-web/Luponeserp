<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루폰스 정산관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#17223B;          /* 사이드바 딥 네이비 */
  --ink-2:#1F2E4D;
  --paper:#F5F6F3;        /* 본문 배경 */
  --card:#FFFFFF;
  --line:#E3E5DE;
  --text:#22262E;
  --muted:#7A8194;
  --primary:#2D5BE3;      /* 주요 액션 블루 */
  --primary-soft:#EAF0FF;
  --stamp:#C9392E;        /* 도장 레드 = 위험/마감초과 */
  --stamp-soft:#FCEBE9;
  --amber:#E08A00;        /* 마감임박 */
  --amber-soft:#FDF3E2;
  --green:#1E8A5A;
  --green-soft:#E6F4ED;
  --radius:10px;
  --shadow:0 1px 3px rgba(23,34,59,.08), 0 4px 14px rgba(23,34,59,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;background:var(--paper);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);letter-spacing:.02em;white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:#FAFBF8}
.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
/* 표가 넓어지면 잘리지 않게 가로 스크롤 */
.card-b.flush{overflow-x:auto}
/* ===== 전역 줄바꿈 방지 ===== */
.nav button,.nav-label,.side-logo,.topbar h2,.card-h h3,.card-h .link,
.stat .k,.stat .v,.dchip,.status-pill,.mini-btn,
.bell-item .t,.bell-item .d,.bell-head,
.acc-h,.acc-item,.acc-count,.p-name,.p-price,
.staff-name,.staff-name small,.staff-daily .k,.staff-daily .v,.staff-stat .k,.staff-stat .v,
.order-total,.order-total span,.line-head span,.sum-cell,.sec-head .t,.sec-add,.line-margin,
.toolbar label,.field label,.modal-h h3,.login-box h1,.login-box .sub,#toast
{white-space:nowrap}
.bell-item .t,.bell-item .d,.acc-item .p-name,.staff-name{overflow:hidden;text-overflow:ellipsis}

/* ===== 로그인 ===== */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink)}
.login-box{background:var(--card);border-radius:16px;padding:44px 40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.stamp-mark{width:34px;height:34px;border:2.5px solid var(--stamp);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--stamp);font-weight:800;font-size:13px;flex-shrink:0}
.login-box h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.login-box .sub{color:var(--muted);font-size:13px;margin-bottom:28px}
.login-box label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;font-weight:600;transition:filter .12s;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn-danger-ghost{background:#fff;border:1px solid var(--line);color:var(--stamp)}
.btn-block{width:100%;padding:12px;margin-top:24px;font-size:15px}
.login-hint{margin-top:20px;padding:12px;background:var(--paper);border-radius:8px;font-size:12px;color:var(--muted);line-height:1.7}
.login-err{color:var(--stamp);font-size:13px;margin-top:12px;display:none}

/* ===== 앱 레이아웃 ===== */
#appView{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:216px;background:var(--ink);color:#B9C2D8;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-logo{display:flex;align-items:center;gap:9px;padding:22px 20px 18px;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.01em}
.side-logo .stamp-mark{width:28px;height:28px;font-size:11px;border-color:#E86A5E;color:#E86A5E}
.nav{flex:1;padding:8px 10px}
.nav-label{font-size:10px;letter-spacing:.12em;color:#6B7690;padding:14px 12px 6px;font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;color:#B9C2D8;font-weight:500;margin-bottom:2px}
.nav button:hover{background:var(--ink-2);color:#fff}
.nav button.active{background:var(--primary);color:#fff;font-weight:600}
.nav .ico{width:18px;text-align:center;flex-shrink:0}
.side-user{padding:16px 20px;border-top:1px solid var(--ink-2);font-size:12px}
.side-user b{display:block;color:#fff;font-size:13px}
.side-user button{color:#8E99B4;margin-top:8px;font-size:12px;text-decoration:underline;padding:0}
.main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topbar h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
.content{padding:24px 28px 60px;max-width:1200px}

/* 알림 벨 */
.bell-wrap{position:relative}
.bell-btn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff}
.bell-badge{position:absolute;top:-5px;right:-5px;background:var(--stamp);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.bell-panel{display:none;position:absolute;right:0;top:48px;width:340px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(23,34,59,.18);z-index:100;overflow:hidden}
.bell-panel.open{display:block}
.bell-head{padding:14px 16px;font-weight:700;border-bottom:1px solid var(--line);font-size:13px}
.bell-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.bell-item:last-child{border-bottom:none}
.bell-item:hover{background:var(--paper)}
.bell-item .t{font-weight:600;font-size:13px}
.bell-item .d{color:var(--muted);font-size:12px}
.bell-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13px}

/* D-day 칩 */
.dchip{display:inline-flex;align-items:center;font-weight:700;font-size:12px;padding:3px 9px;border-radius:20px;font-variant-numeric:tabular-nums}
.d-over{background:var(--stamp-soft);color:var(--stamp)}
.d-soon{background:var(--amber-soft);color:var(--amber)}
.d-ok{background:var(--paper);color:var(--muted)}
.d-done{background:var(--green-soft);color:var(--green)}

/* 카드/스탯 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px;font-weight:700}
.card-b{padding:20px}
.card-b.flush{padding:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted)}
.stat.warn .v{color:var(--amber)}
.stat.danger .v{color:var(--stamp)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.sidebar{width:60px}.side-logo span,.nav-label,.nav .txt,.side-user{display:none}.content,.topbar{padding-left:16px;padding-right:16px}}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .filters{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto}
.status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.st-ing{background:var(--primary-soft);color:var(--primary)}
.st-done{background:var(--green-soft);color:var(--green)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.link{color:var(--primary);font-weight:600;cursor:pointer;background:none;padding:0}
.mini-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600}
.mini-btn:hover{background:var(--paper)}
.mini-btn.red{color:var(--stamp)}
.mini-btn.blue{color:var(--primary);border-color:var(--primary)}

/* 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(23,34,59,.5);z-index:200;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.modal.wide{max-width:560px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px;font-weight:800}
.modal-x{font-size:20px;color:var(--muted);width:30px;height:30px;border-radius:6px}
.modal-x:hover{background:var(--paper)}
.modal-b{padding:22px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field .req{color:var(--stamp)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* 상품 아코디언 */
.acc{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;background:#fff}
.acc-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#FBFBF9;cursor:pointer;font-weight:700}
.acc-h:hover{background:var(--paper)}
.acc-h .arrow{transition:transform .15s;color:var(--muted);font-size:12px}
.acc.open .acc-h .arrow{transform:rotate(90deg)}
.acc-body{display:none}
.acc.open .acc-body{display:block}
.acc-item{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line)}
.acc-item .p-name{font-weight:600}
.acc-item .p-price{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.acc-item.pickable{cursor:pointer}
.acc-item.pickable:hover{background:var(--primary-soft)}
.acc-count{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}

/* 직원별 매출 아코디언 */
.staff-acc .acc-h{background:#fff;padding:15px 18px}
.staff-head{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.staff-avatar{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.staff-name{font-weight:700;font-size:14px}
.staff-name small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.staff-daily{margin-left:auto;text-align:right;padding-right:6px}
.staff-daily .k{font-size:11px;color:var(--muted);font-weight:600}
.staff-daily .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.staff-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 18px;border-top:1px solid var(--line);background:#FBFBF9}
.staff-stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.staff-stat .k{font-size:11px;color:var(--muted);font-weight:700}
.staff-stat .v{font-size:16px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.staff-stat .v small{font-size:12px;font-weight:600;color:var(--muted)}
.staff-stat.hot .v{color:var(--stamp)}
@media(max-width:900px){.staff-stats{grid-template-columns:1fr 1fr}}

/* 주문 등록 라인 */
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 8px;margin-top:14px;border-bottom:1px solid var(--line)}
.sec-head .t{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.sec-head .t.sell{color:var(--primary)}
.sec-head .t.buy{color:var(--amber)}
.sec-add{font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px}
.sec-add.sell{background:var(--primary-soft);color:var(--primary)}
.sec-add.buy{background:var(--amber-soft);color:var(--amber)}
.sec-empty{padding:22px;text-align:center;color:#B4BAC8;font-size:13px;border:1px dashed var(--line);border-radius:10px;margin-top:10px}
.order-row{display:grid;grid-template-columns:1.6fr 1.3fr 1fr .6fr 1fr 32px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.line-margin{font-size:12px;font-weight:700;text-align:left}
.pick-btn{border:1px dashed var(--primary);color:var(--primary);border-radius:8px;padding:9px 10px;font-weight:600;background:var(--primary-soft);width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-btn.picked{border-style:solid;background:#fff}
.sum-cell{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rm{color:var(--stamp);font-size:16px;width:32px;height:32px;border-radius:6px}
.rm:hover{background:var(--stamp-soft)}
.line-head{display:grid;grid-template-columns:1.6fr 1.3fr 1fr .6fr 1fr 32px;gap:8px;font-size:11px;color:var(--muted);font-weight:700;padding-bottom:6px}
.sup-btn{border:1px dashed var(--amber);color:var(--amber);border-radius:8px;padding:9px 10px;font-weight:600;background:var(--amber-soft);width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.sup-btn.picked{border-style:solid;background:#fff}
.margin-pos{color:var(--green)}
.margin-neg{color:var(--stamp)}
.order-total{display:flex;justify-content:flex-end;gap:32px;padding:16px 4px 0;font-size:14px}
.order-total b{font-size:17px;font-variant-numeric:tabular-nums}
.order-total .grand{color:var(--primary)}

/* 견적서 문서 */
.quote-doc{background:#fff;border:1px solid var(--line);max-width:760px;margin:0 auto;padding:48px 52px;box-shadow:var(--shadow);position:relative}
.quote-doc h1{text-align:center;font-size:28px;letter-spacing:.06em;font-weight:800;margin-bottom:8px;color:var(--ink);white-space:nowrap}
.quote-underline{border-bottom:3px double var(--ink);margin-bottom:24px;padding-bottom:14px;text-align:center;color:var(--muted);font-size:13px}
.quote-meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px;font-size:13px}
.quote-meta table td{padding:6px 8px;border:1px solid var(--line);font-size:13px;white-space:nowrap}
.quote-meta .lbl{background:#F4F5F1;font-weight:700;width:88px;color:#444}
.quote-meta h4{font-size:13px;font-weight:800;margin-bottom:8px;color:var(--ink)}
.supplier-stamp{position:relative}
.stamp-seal{position:absolute;right:-6px;top:26px;width:52px;height:52px;border:2.5px solid var(--stamp);border-radius:50%;color:var(--stamp);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;transform:rotate(-8deg);opacity:.85;background:rgba(255,255,255,.6)}
.quote-items td,.quote-items th{border:1px solid var(--line);font-size:13px;white-space:nowrap}
.quote-items th{background:#F4F5F1;color:#444;text-align:center;padding:9px}
.quote-items td{padding:9px 10px}
.quote-items tfoot td{font-weight:800;background:#FBFBF7}
.quote-note{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.8}
.quote-total-line{margin:18px 0;padding:12px 16px;background:#F4F5F1;border:1px solid var(--line);font-weight:800;font-size:15px;display:flex;justify-content:space-between;white-space:nowrap;gap:12px}
.quote-headline{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.quote-box{padding:12px 16px;background:#F4F5F1;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;white-space:nowrap;gap:10px}
.quote-box .lb{font-weight:800;font-size:14px;color:#444}
.quote-box .vl{font-weight:800;font-size:16px;color:var(--ink)}
.quote-box.total .vl{font-size:18px}
.quote-note{white-space:nowrap}

/* 차트 */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding:10px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bar{width:100%;max-width:44px;background:linear-gradient(180deg,#4C74EA,var(--primary));border-radius:6px 6px 2px 2px;min-height:3px;position:relative;transition:filter .12s}
.bar:hover{filter:brightness(1.12)}
.bar .tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:5px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}
.bar:hover .tip{display:block}
.bar-lbl{font-size:11px;color:var(--muted);font-weight:600}
.rank-num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--paper);color:var(--muted);font-weight:800;font-size:12px;align-items:center;justify-content:center}
.rank-num.top{background:var(--ink);color:#fff}
.share-bar{height:6px;background:var(--paper);border-radius:4px;overflow:hidden;margin-top:5px}
.share-bar i{display:block;height:100%;background:var(--primary);border-radius:4px}

/* 토스트 */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;font-size:14px;transition:transform .25s;z-index:500;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}

@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .quote-doc{border:none;box-shadow:none;max-width:100%;padding:20px}
  .no-print{display:none!important}
}
</style>
</head>
<body>

<!-- ===================== 로그인 ===================== -->
<div id="loginView">
  <div class="login-box">
    <div class="login-logo"><div class="stamp-mark">루</div><h1>루폰스 정산관리</h1></div>
    <div class="sub">사내 전용 · 계정으로 로그인하세요</div>
    <label>아이디</label>
    <input id="loginId" placeholder="아이디 입력" autocomplete="username">
    <label>비밀번호</label>
    <input id="loginPw" type="password" placeholder="비밀번호 입력" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-err" id="loginErr">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- ===================== 앱 ===================== -->
<div id="appView">
<div class="layout">
  <aside class="sidebar">
    <div class="side-logo"><div class="stamp-mark">루</div><span>루폰스 정산관리</span></div>
    <nav class="nav" id="navMenu">
      <div class="nav-label">업무</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">

<script>
/* ============================================================
   데이터 (브라우저 메모리 저장 — 새로고침 시 초기화)
============================================================ */
const today = new Date(); today.setHours(0,0,0,0);
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); } // 로컬 기준 날짜 문자열 (UTC 변환 X)
function dstr(offset){ const d=new Date(today); d.setDate(d.getDate()+offset); return ymd(d); }

/* ============================================================
   Supabase 연동 (데이터 영구 저장 · 팀 공유)
============================================================ */
const SB_URL='https://szmenayblndgwjitqtww.supabase.co';
const SB_KEY='sb_publishable_BLlvvY7I-MKv2pAwYSSFdA_OYKO1Khg';
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;

let users=[], clients=[], suppliers=[], supCategories=[], supProducts=[], categories=[], products=[], orders=[], notifications=[], quoteForms=[];

async function dbIns(t,row){
  const {data,error}=await sb.from(t).insert(row).select().single();
  if(error){ console.error(t,error); toast('저장 실패: '+(error.message||'서버 오류')); throw error; }
  return data;
}
async function dbUpd(t,id,patch){
  const {error}=await sb.from(t).update(patch).eq('id',id);
  if(error){ console.error(t,error); toast('수정 실패: '+(error.message||'서버 오류')); throw error; }
}
async function dbDel(t,id){
  const {error}=await sb.from(t).delete().eq('id',id);
  if(error){ console.error(t,error); toast('삭제 실패: '+(error.message||'서버 오류')); throw error; }
}
async function loadAll(){
  const tables=['users','clients','suppliers','supCategories','supProducts','categories','products','orders','notifications','quoteForms'];
  const res=await Promise.all(tables.map(t=>sb.from(t).select('*').order('id')));
  for(let i=0;i<res.length;i++){
    if(res[i].error){ console.error(tables[i],res[i].error); toast('데이터를 불러오지 못했습니다: '+tables[i]); return false; }
  }
  [users,clients,suppliers,supCategories,supProducts,categories,products,orders,notifications,quoteForms]=res.map(r=>r.data||[]);
  return true;
}
async function refreshData(){
  toast('데이터를 새로고침하는 중...');
  if(await loadAll()){ go(currentPage); toast('최신 데이터로 갱신했습니다'); }
}

const supplier = {name:'주식회사 루폰스', bizNo:'569-88-02994', ceo:'유재덕', addr:'경기도 파주시 중앙로 291, 4층', phone:'', email:''};

let currentUser = null;
let currentPage = 'dashboard';

/* ============================================================
   유틸
============================================================ */
const won = n => n.toLocaleString('ko-KR') + '원';
const wonS = n => n.toLocaleString('ko-KR');
const clientOf = id => clients.find(c=>c.id===id);
const userOf = id => users.find(u=>u.id===id);
const orderTotal = o => o.items.reduce((s,i)=>s+i.price*i.qty,0);
const orderCost  = o => (o.buyItems||[]).reduce((s,i)=>s+(i.cost||0)*i.qty,0);
const orderMargin= o => orderTotal(o)-orderCost(o);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ddays(due){ // 남은 일수: 양수=남음, 0=오늘, 음수=초과
  const d = new Date(due+'T00:00:00');
  return Math.round((d - today)/86400000);
}
function dChip(o){
  if(o.status==='완료') return '<span class="dchip d-done">완료</span>';
  const n = ddays(o.dueDate);
  if(n<0)  return `<span class="dchip d-over">D+${-n} 초과</span>`;
  if(n===0)return `<span class="dchip d-over">D-DAY</span>`;
  if(n<=3) return `<span class="dchip d-soon">D-${n}</span>`;
  return `<span class="dchip d-ok">D-${n}</span>`;
}
function myOrders(){ return currentUser.role==='admin' ? orders : orders.filter(o=>o.userId===currentUser.id); }
function myClients(){ return currentUser.role==='admin' ? clients : clients.filter(c=>c.userId===currentUser.id); }
function alertOrders(){ return myOrders().filter(o=>o.status==='진행중' && ddays(o.dueDate)<=3).sort((a,b)=>ddays(a.dueDate)-ddays(b.dueDate)); }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============================================================
   로그인 / 네비게이션
============================================================ */
async function doLogin(){
  const id=document.getElementById('loginId').value.trim();
  const pw=document.getElementById('loginPw').value;
  const err=document.getElementById('loginErr');
  err.style.display='none';
  if(!sb){ err.textContent='서버 연결 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'; err.style.display='block'; return; }
  const btn=document.querySelector('#loginView .btn-block');
  btn.disabled=true; btn.textContent='로그인 중...';
  try{
    const {data:u,error}=await sb.from('users').select('*').eq('username',id).eq('pw',pw).maybeSingle();
    if(error){ err.textContent='서버 연결에 실패했습니다. 잠시 후 다시 시도하세요.'; err.style.display='block'; return; }
    if(!u){ err.textContent='아이디 또는 비밀번호가 올바르지 않습니다.'; err.style.display='block'; return; }
    currentUser=u;
    if(!await loadAll()){ currentUser=null; err.textContent='데이터를 불러오지 못했습니다.'; err.style.display='block'; return; }
  } finally { btn.disabled=false; btn.textContent='로그인'; }
  document.getElementById('loginView').style.display='none';
  document.getElementById('appView').style.display='block';
  document.getElementById('sideUserName').textContent=u.name;
  document.getElementById('sideUserRole').textContent=u.role==='admin'?'슈퍼어드민':'팀원';
  document.getElementById('navUsers').style.display=u.role==='admin'?'flex':'none';
  document.getElementById('navForms').style.display=u.role==='admin'?'flex':'none';
  go('dashboard');
  showFeedbackPopup();
}

/* 관리자 피드백 요청 알림 */
async function sendPing(userId, orderId){
  if(currentUser.role!=='admin'){ toast('알림 전송은 슈퍼어드민만 가능합니다'); return; }
  if(notifications.some(n=>n.orderId===orderId&&n.toUserId===userId&&!n.read)){ toast('이미 알림을 보냈습니다'); return; }
  const row=await dbIns('notifications',{toUserId:userId, orderId, fromName:currentUser.name, sentAt:ymd(today), read:false});
  notifications.push(row);
  toast(`${userOf(userId)?.name||''}님에게 알림을 보냈습니다`);
  renderDashboard(); // '전송됨' 표시 갱신
  const acc=document.getElementById('staff-'+userId); if(acc) acc.classList.add('open');
}
function showFeedbackPopup(){
  const mine=notifications.filter(n=>n.toUserId===currentUser.id&&!n.read);
  if(!mine.length) return;
  openModal(`
  <div class="modal-h"><h3>📢 관리자 피드백 요청</h3><button class="modal-x" onclick="readPings()">×</button></div>
  <div class="modal-b">
    <div style="background:var(--stamp-soft);color:var(--stamp);font-weight:700;padding:12px 14px;border-radius:8px;margin-bottom:16px">
      관리자님께서 마감임박 상품에 대한 피드백을 요청하셨습니다.
    </div>
    ${mine.map(n=>{
      const o=orders.find(x=>x.id===n.orderId);
      if(!o) return '';
      return `<div style="border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px">
        ${dChip(o)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:700">${esc(clientOf(o.clientId)?.name||'-')} · ${esc(o.items[0].name)}${o.items.length>1?` 외 ${o.items.length-1}건`:''}</div>
          <div style="font-size:12px;color:var(--muted)">마감일 ${o.dueDate} · ${won(orderTotal(o))} · 요청자 ${esc(n.fromName)}</div>
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="modal-f">
    <button class="btn btn-ghost" onclick="readPings()">확인</button>
    <button class="btn btn-primary" onclick="readPings();go('orders')">주문 확인하러 가기</button>
  </div>`, true);
}
async function readPings(){
  notifications.forEach(n=>{ if(n.toUserId===currentUser.id) n.read=true; });
  closeModal();
  await sb.from('notifications').update({read:true}).eq('toUserId',currentUser.id);
}
function logout(){
  currentUser=null;
  document.getElementById('appView').style.display='none';
  document.getElementById('loginView').style.display='flex';
  document.getElementById('loginId').value=''; document.getElementById('loginPw').value='';
  document.getElementById('loginErr').style.display='none';
}
const titles={dashboard:'대시보드',orderNew:'주문 등록',orders:'주문 목록',quote:'견적서',clients:'거래처 관리',suppliers:'공급사 관리',products:'상품 관리',forms:'견적서 양식',erp:'매출 ERP',users:'계정 관리'};
function go(page, param){
  currentPage=page;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  document.getElementById('pageTitle').textContent=titles[page];
  document.getElementById('bellPanel').classList.remove('open');
  renderBell();
  ({dashboard:renderDashboard,orderNew:renderOrderNew,orders:renderOrders,quote:()=>renderQuote(param),clients:renderClients,suppliers:renderSuppliers,products:renderProducts,forms:renderForms,erp:renderErp,users:renderUsers})[page]();
  document.querySelector('.main').scrollTop=0; window.scrollTo(0,0);
}

/* ============================================================
   알림 벨
============================================================ */
function renderBell(){
  const list=alertOrders();
  const badge=document.getElementById('bellBadge');
  badge.style.display=list.length?'flex':'none';
  badge.textContent=list.length;
  document.getElementById('bellList').innerHTML = list.length ? list.map(o=>{
    const c=clientOf(o.clientId);
    return `<div class="bell-item" onclick="go('orders')">
      <div>${dChip(o)}</div>
      <div style="flex:1;min-width:0">
        <div class="t">${esc(c?.name||'-')} · ${won(orderTotal(o))}</div>
        <div class="d">마감일 ${o.dueDate} · 담당 ${esc(userOf(o.userId)?.name||'-')}</div>
      </div>
    </div>`;
  }).join('') : '<div class="bell-empty">마감 임박한 주문이 없습니다 🎉</div>';
}
function toggleBell(e){ e.stopPropagation(); document.getElementById('bellPanel').classList.toggle('open'); }
document.addEventListener('click',e=>{ if(!e.target.closest('.bell-wrap')) document.getElementById('bellPanel').classList.remove('open'); });

/* ============================================================
   모달
============================================================ */
function openModal(html, wide){ 
  const box=document.getElementById('modalBox');
  box.className='modal'+(wide?' wide':''); box.innerHTML=html;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

/* ============================================================
   대시보드
============================================================ */
function renderDashboard(){
  const list=myOrders();
  const thisMonth=ymd(today).slice(0,7);
  const monthSales=list.filter(o=>o.date.startsWith(thisMonth)).reduce((s,o)=>s+orderTotal(o),0);
  const ing=list.filter(o=>o.status==='진행중');
  const alerts=alertOrders();
  const recent=[...list].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  document.getElementById('content').innerHTML=`
  <div class="stats">
    <div class="stat"><div class="k">이번 달 매출</div><div class="v">${wonS(monthSales)}<small> 원</small></div></div>
    <div class="stat"><div class="k">전체 주문</div><div class="v">${list.length}<small> 건</small></div></div>
    <div class="stat"><div class="k">진행중 주문</div><div class="v">${ing.length}<small> 건</small></div></div>
    <div class="stat ${alerts.length?'danger':''}"><div class="k">마감 임박 · 초과</div><div class="v">${alerts.length}<small> 건</small></div></div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-h"><h3>⏰ 마감 임박 주문</h3><button class="link" onclick="go('orders')">전체 보기</button></div>
      <div class="card-b flush">
        ${alerts.length ? `<table><thead><tr><th>마감</th><th>거래처</th><th class="num">금액</th><th>마감일</th></tr></thead><tbody>
          ${alerts.map(o=>`<tr><td>${dChip(o)}</td><td><b>${esc(clientOf(o.clientId)?.name||'-')}</b></td><td class="num">${wonS(orderTotal(o))}</td><td>${o.dueDate}</td></tr>`).join('')}
        </tbody></table>` : '<div class="empty">마감 임박한 주문이 없습니다</div>'}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>최근 주문</h3><button class="link" onclick="go('orderNew')">+ 주문 등록</button></div>
      <div class="card-b flush">
        ${recent.length ? `<table><thead><tr><th>등록일</th><th>거래처</th><th class="num">금액</th><th>상태</th></tr></thead><tbody>
          ${recent.map(o=>`<tr><td>${o.date}</td><td><b>${esc(clientOf(o.clientId)?.name||'-')}</b></td><td class="num">${wonS(orderTotal(o))}</td><td><span class="status-pill ${o.status==='완료'?'st-done':'st-ing'}">${o.status}</span></td></tr>`).join('')}
        </tbody></table>` : '<div class="empty">등록된 주문이 없습니다</div>'}
      </div>
    </div>
  </div>
  ${currentUser.role==='admin' ? renderStaffSection() : ''}`;
}

/* 직원별 매출 현황 (슈퍼어드민 전용) */
function renderStaffSection(){
  const todayStr=ymd(today);
  const weekAgo=dstr(-6);   // 오늘 포함 최근 7일
  const thisMonth=ymd(today).slice(0,7);
  const staffList=users.map(u=>{
    const mine=orders.filter(o=>o.userId===u.id);
    const daily=mine.filter(o=>o.date===todayStr).reduce((s,o)=>s+orderTotal(o),0);
    const weekly=mine.filter(o=>o.date>=weekAgo).reduce((s,o)=>s+orderTotal(o),0);
    const monthly=mine.filter(o=>o.date.startsWith(thisMonth)).reduce((s,o)=>s+orderTotal(o),0);
    const urgent=mine.filter(o=>o.status==='진행중'&&ddays(o.dueDate)<=3).sort((a,b)=>ddays(a.dueDate)-ddays(b.dueDate));
    return {u, mine, daily, weekly, monthly, urgent};
  }).sort((a,b)=>b.daily-a.daily);

  return `
  <div class="card" style="margin-top:16px">
    <div class="card-h"><h3>👥 직원별 매출 현황</h3><span style="font-size:12px;color:var(--muted)">카드를 누르면 상세가 펼쳐집니다</span></div>
    <div class="card-b" style="padding:14px 18px">
      ${staffList.map(({u,mine,daily,weekly,monthly,urgent})=>`
      <div class="acc staff-acc" id="staff-${u.id}">
        <div class="acc-h" onclick="document.getElementById('staff-${u.id}').classList.toggle('open')">
          <div class="staff-head">
            <div class="staff-avatar">${esc(u.name.slice(0,1))}</div>
            <div class="staff-name">${esc(u.name)}<small>${u.role==='admin'?'슈퍼어드민':'팀원'} · ${esc(u.username)}</small></div>
            <div class="staff-daily"><div class="k">오늘 매출</div><div class="v">${wonS(daily)}원</div></div>
            ${urgent.length?`<span class="dchip d-over">임박 ${urgent.length}</span>`:''}
          </div>
          <span class="arrow">▶</span>
        </div>
        <div class="acc-body">
          <div class="staff-stats">
            <div class="staff-stat"><div class="k">주간 매출 (최근 7일)</div><div class="v">${wonS(weekly)}<small> 원</small></div></div>
            <div class="staff-stat"><div class="k">월간 매출 (이번 달)</div><div class="v">${wonS(monthly)}<small> 원</small></div></div>
            <div class="staff-stat"><div class="k">주문 건수</div><div class="v">${mine.length}<small> 건</small> <small>(진행중 ${mine.filter(o=>o.status==='진행중').length})</small></div></div>
            <div class="staff-stat ${urgent.length?'hot':''}"><div class="k">마감 임박 · 초과</div><div class="v">${urgent.length}<small> 건</small></div></div>
          </div>
          ${urgent.length?`<div style="padding:0 18px 16px;background:#FBFBF9;overflow-x:auto">
            <table style="background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden">
              <thead><tr><th>마감</th><th>거래처</th><th>품목</th><th class="num">금액</th><th>마감일</th><th style="width:110px"></th></tr></thead><tbody>
              ${urgent.map(o=>{
                const sent=notifications.some(n=>n.orderId===o.id&&n.toUserId===u.id&&!n.read);
                return `<tr>
                <td>${dChip(o)}</td>
                <td><b>${esc(clientOf(o.clientId)?.name||'-')}</b></td>
                <td>${esc(o.items[0].name)}${o.items.length>1?` 외 ${o.items.length-1}건`:''}</td>
                <td class="num">${wonS(orderTotal(o))}</td>
                <td>${o.dueDate}</td>
                <td style="text-align:right">${u.id===currentUser.id
                  ?'<span style="font-size:12px;color:var(--muted)">본인</span>'
                  :sent
                    ?'<span style="font-size:12px;color:var(--green);font-weight:600">✓ 알림 전송됨</span>'
                    :`<button class="mini-btn blue" onclick="event.stopPropagation();sendPing(${u.id},${o.id})">🔔 알림 보내기</button>`}</td>
              </tr>`;}).join('')}
              </tbody></table>
          </div>`:''}
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}
function renderClients(){
  document.getElementById('content').innerHTML=`
  <div class="toolbar">

  const p=pid?products.find(x=>x.id===pid):{name:'',price:'',spId:null};
  openModal(`
  <div class="modal-h"><h3>${pid?'상품 수정':'상품 등록'} · ${esc(categories.find(c=>c.id===catId).name)}</h3><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-b">
    <div class="field"><label>상품명 <span class="req">*</span></label><input id="f_pname" value="${esc(p.name)}"></div>
    <div class="field"><label>기본 판매가 (원) <span class="req">*</span></label><input id="f_pprice" type="number" min="0" value="${p.price}"></div>
    <div class="field"><label>매입 공급사 상품 (원가 자동 연결)</label>
      <select id="f_pspid">
        <option value="">공급사 없음 (자체상품)</option>
        ${suppliers.map(sup=>{
          const cats=supCategories.filter(c=>c.supId===sup.id);
          return cats.map(cat=>{
            const cps=supProducts.filter(x=>x.supCatId===cat.id);
            if(!cps.length) return '';
            return `<optgroup label="${esc(sup.name)} · ${esc(cat.name)}">
              ${cps.map(x=>`<option value="${x.id}" ${p.spId===x.id?'selected':''}>${esc(x.name)} — 원가 ${wonS(x.cost)}원</option>`).join('')}
            </optgroup>`;
          }).join('');
        }).join('')}
      </select>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">연결하면 주문 등록 시 이 상품을 고를 때 매입(원가)이 자동으로 채워집니다.</div>
    </div>
  </div>
  <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="saveProd(${catId},${pid||0})">저장</button></div>`);
}
async function saveProd(catId,pid){
  if(currentUser.role!=='admin'){ toast('상품 등록·수정은 슈퍼어드민만 가능합니다'); return; }
  const name=document.getElementById('f_pname').value.trim();
  const price=parseInt(document.getElementById('f_pprice').value)||0;
  const sv=document.getElementById('f_pspid').value;
  const spId=sv?parseInt(sv):null;
  if(!name||price<=0){ toast('상품명과 판매가를 입력하세요'); return; }
  try{
    if(pid){ await dbUpd('products',pid,{name,price,spId}); Object.assign(products.find(p=>p.id===pid),{name,price,spId}); toast('상품을 수정했습니다'); }
    else{ const row=await dbIns('products',{catId,name,price,spId}); products.push(row); toast('상품을 등록했습니다'); }
  }catch(e){ return; }
  closeModal(); renderProducts();
  document.getElementById('acc-'+catId)?.classList.add('open');
}
async function delProd(id){
  if(currentUser.role!=='admin'){ toast('상품 삭제는 슈퍼어드민만 가능합니다'); return; }
  if(!confirm('이 상품을 삭제할까요?')) return;
  try{ await dbDel('products',id); }catch(e){ return; }
  products=products.filter(p=>p.id!==id); renderProducts(); toast('삭제했습니다');
}

/* 작업 일수 ↔ 마감일 자동 계산 (시작일 포함) */
/* 거래처 선택 시 그 거래처 담당자를 주문 담당자로 자동 지정 (어드민만 변경 가능) */
function syncOrderOwner(){
  if(currentUser.role!=='admin') return;
  const cid=parseInt(document.getElementById('o_client').value)||0;
  const c=clientOf(cid);
  if(c&&c.userId&&users.some(u=>u.id===c.userId)) document.getElementById('o_owner').value=c.userId;
}
function calcDue(){
  const start=document.getElementById('o_start').value;
  const days=parseInt(document.getElementById('o_days').value);
  if(!start||!days||days<1) return;
  const d=new Date(start+'T00:00:00');
  d.setDate(d.getDate()+days-1); // 시작일 포함이므로 -1
  document.getElementById('o_due').value=ymd(d);
}
function calcDays(){
  const start=document.getElementById('o_start').value;
  const due=document.getElementById('o_due').value;
  if(!start||!due) return;
  const diff=Math.round((new Date(due+'T00:00:00')-new Date(start+'T00:00:00'))/86400000)+1;
  if(diff>=1) document.getElementById('o_days').value=diff;
}

/* ---- 판매 상품 섹션 ---- */
function renderSellLines(){
  const el=document.getElementById('sellLines');
  el.innerHTML = draftSell.length ? `
    <div class="line-head" style="padding:8px 0 2px"><span>상품 선택</span><span>메모</span><span style="text-align:right">판매가</span><span style="text-align:right">수량</span><span style="text-align:right">합계</span><span></span></div>
    ${draftSell.map((l,i)=>`
    <div class="order-row">
      <button class="pick-btn ${l.productId?'picked':''}" onclick="openPicker(${i})">${l.productId?esc(l.name):'상품 선택 ▾'}</button>
      <input placeholder="메모" value="${esc(l.memo)}" oninput="draftSell[${i}].memo=this.value">
      <input type="number" min="0" value="${l.price}" style="text-align:right" oninput="draftSell[${i}].price=parseInt(this.value)||0;updSell(${i})">
      <input type="number" min="1" value="${l.qty}" style="text-align:right" oninput="draftSell[${i}].qty=parseInt(this.value)||0;updSell(${i})">
      <div class="sum-cell" id="sellSum${i}">${wonS(l.price*l.qty)}</div>
      <button class="rm" onclick="rmSellLine(${i})" title="삭제">✕</button>
    </div>`).join('')}`
  : '<div class="sec-empty">판매 상품을 추가하려면 [＋ 판매 상품 추가] 버튼을 클릭하세요</div>';
  updTotal();
}
function addSellLine(){ draftSell.push({productId:null,name:'',memo:'',price:0,qty:1}); renderSellLines(); }
function rmSellLine(i){ draftSell.splice(i,1); renderSellLines(); }
function updSell(i){ document.getElementById('sellSum'+i).textContent=wonS(draftSell[i].price*draftSell[i].qty); updTotal(); }

/* ---- 공급사 주문(매입) 섹션 ---- */
function renderBuyLines(){
  const el=document.getElementById('buyLines');
  el.innerHTML = draftBuy.length ? `
    <div class="line-head" style="padding:8px 0 2px"><span>공급사 서비스 상품</span><span>메모</span><span style="text-align:right">원가</span><span style="text-align:right">수량</span><span style="text-align:right">합계</span><span></span></div>
    ${draftBuy.map((l,i)=>`
    <div class="order-row">
      <button class="sup-btn ${l.spId?'picked':''}" onclick="openSupPicker(${i})">${l.spId?esc(l.spName):'공급사 상품 선택 ▾'}</button>
      <input placeholder="메모" value="${esc(l.memo)}" oninput="draftBuy[${i}].memo=this.value">
      <input type="number" min="0" value="${l.cost}" style="text-align:right" oninput="draftBuy[${i}].cost=parseInt(this.value)||0;updBuy(${i})">
      <input type="number" min="1" value="${l.qty}" style="text-align:right" oninput="draftBuy[${i}].qty=parseInt(this.value)||0;updBuy(${i})">
      <div class="sum-cell" id="buySum${i}" style="color:var(--amber)">${wonS((l.cost||0)*l.qty)}</div>
      <button class="rm" onclick="rmBuyLine(${i})" title="삭제">✕</button>
    </div>`).join('')}`
  : '<div class="sec-empty">공급사 주문(매입)이 있으면 [＋ 공급사 주문 추가] 버튼으로 등록하세요 (선택사항)</div>';
  updTotal();
}
function addBuyLine(){ draftBuy.push({spId:null,spName:'',memo:'',cost:0,qty:1}); renderBuyLines(); }
function rmBuyLine(i){ draftBuy.splice(i,1); renderBuyLines(); }
function updBuy(i){ document.getElementById('buySum'+i).textContent=wonS((draftBuy[i].cost||0)*draftBuy[i].qty); updTotal(); }

function updTotal(){
  if(!document.getElementById('tSupply')) return;
  const supply=draftSell.reduce((s,l)=>s+l.price*l.qty,0);
  const cost=draftBuy.reduce((s,l)=>s+(l.cost||0)*l.qty,0);
  const margin=supply-cost;
  const vat=Math.round(supply*0.1);
  document.getElementById('tSupply').textContent=won(supply);
  document.getElementById('tCost').textContent=won(cost);
  const m=document.getElementById('tMargin');
  m.textContent=won(margin);
  m.className=margin>=0?'margin-pos':'margin-neg';
  document.getElementById('tMarginRate').textContent=supply>0?`(${Math.round(margin/supply*100)}%)`:'';
  document.getElementById('tVat').textContent=won(vat);
  document.getElementById('tGrand').textContent=won(supply+vat);
}

function openPicker(lineIdx){
  openModal(`
  <div class="modal-h"><h3>상품 선택</h3><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-b" style="max-height:60vh;overflow:auto">
    ${categories.map(cat=>{
      const ps=products.filter(p=>p.catId===cat.id);
      return `<div class="acc" id="pk-${cat.id}">

          <span>${esc(cat.name)}<span class="acc-count">${ps.length}개</span></span><span class="arrow">▶</span>
        </div>
        <div class="acc-body">
          ${ps.length ? ps.map(p=>`<div class="acc-item pickable" onclick="pickProduct(${lineIdx},${p.id})">
            <span><span class="p-name">${esc(p.name)}</span><span class="acc-count">· ${prodSupLabel(p)}</span></span><span class="p-price">${won(p.price)}</span>
          </div>`).join('') : '<div class="acc-item" style="color:var(--muted)">상품 없음</div>'}
        </div></div>`;
    }).join('') || '<div class="empty">상품 관리에서 카테고리와 상품을 먼저 등록하세요.</div>'}
  </div>`, true);
}
function pickProduct(lineIdx, pid){
  const p=products.find(x=>x.id===pid);
  draftSell[lineIdx]={...draftSell[lineIdx], productId:p.id, name:p.name, price:p.price};
  closeModal(); renderSellLines();
  autoLinkBuy(p, draftSell[lineIdx].qty||1);
}
/* 판매 상품에 연결된 공급사 상품이 있으면 매입 줄 자동 추가 */
function autoLinkBuy(p, qty){
  if(!p.spId) return;
  const sp=supProducts.find(x=>x.id===p.spId);
  if(!sp) return;
  if(draftBuy.some(l=>l.spId===sp.id)) return; // 이미 있으면 중복 추가 안 함
  const sup=suppliers.find(x=>x.id===sp.supId);
  const cat=supCategories.find(c=>c.id===sp.supCatId);
  const label=`${sup?.name||''}${cat?' · '+cat.name:''} · ${sp.name}`;
  const empty=draftBuy.findIndex(l=>!l.spId&&!l.cost);
  const row={spId:sp.id, spName:label, memo:'', cost:sp.cost, qty:qty||1};
  if(empty>=0) draftBuy[empty]=row; else draftBuy.push(row);
  renderBuyLines();
  toast('연결된 공급사 매입이 자동 입력되었습니다');
}

/* 공급사 서비스 상품 선택 모달 (매입) */

    ${suppliers.map(sup=>{
      const cats=supCategories.filter(c=>c.supId===sup.id);
      return `<div class="acc open" id="spk-${sup.id}">
        <div class="acc-h" onclick="document.getElementById('spk-${sup.id}').classList.toggle('open')">
          <span>${esc(sup.name)}<span class="acc-count">${supProducts.filter(p=>p.supId===sup.id).length}개 서비스</span></span><span class="arrow">▶</span>

            const cps=supProducts.filter(p=>p.supCatId===cat.id);
            return `<div class="acc open" id="spkc-${cat.id}" style="margin-bottom:6px">
              <div class="acc-h" onclick="event.stopPropagation();document.getElementById('spkc-${cat.id}').classList.toggle('open')" style="padding:10px 13px">
                <span>${esc(cat.name)}<span class="acc-count">${cps.length}개</span></span><span class="arrow">▶</span>
              </div>
              <div class="acc-body">
                ${cps.length ? cps.map(p=>`<div class="acc-item pickable" onclick="pickSupProduct(${lineIdx},${p.id})">
                  <span class="p-name">${esc(p.name)}</span><span class="p-price">원가 ${won(p.cost)}</span>
                </div>`).join('') : '<div class="acc-item" style="color:var(--muted)">상품 없음</div>'}

function pickSupProduct(lineIdx, spid){
  if(!spid){ draftBuy[lineIdx]={...draftBuy[lineIdx], spId:'direct', spName:'직접 매입'}; }
  else{
    const p=supProducts.find(x=>x.id===spid);
    const sup=suppliers.find(s=>s.id===p.supId);
    const cat=supCategories.find(c=>c.id===p.supCatId);
    draftBuy[lineIdx]={...draftBuy[lineIdx], spId:p.id, spName:`${sup?.name||''}${cat?' · '+cat.name:''} · ${p.name}`, cost:p.cost};
  }
  closeModal(); renderBuyLines();
}
async function saveOrder(){
  const clientId=parseInt(document.getElementById('o_client').value);
  const startDate=document.getElementById('o_start').value;
  const dueDate=document.getElementById('o_due').value;
  if(!clientId){ toast('거래처를 선택하세요'); return; }
  if(!startDate||!dueDate){ toast('시작일과 마감일을 입력하세요'); return; }
  if(dueDate<startDate){ toast('마감일은 시작일 이후여야 합니다'); return; }
  const items=draftSell.filter(l=>l.productId&&l.qty>0);
  if(!items.length){ toast('판매 상품을 1개 이상 추가하세요'); return; }
  const buyItems=draftBuy.filter(l=>(l.spId||l.cost>0)&&l.qty>0).map(l=>({spId:l.spId==='direct'?null:l.spId,spName:l.spName||'직접 매입',memo:l.memo,cost:l.cost||0,qty:l.qty}));
  const userId = currentUser.role==='admin'
    ? (parseInt(document.getElementById('o_owner').value)||currentUser.id)
    : currentUser.id;
  const formId=parseInt(document.getElementById('o_form').value)||null;
  const o={clientId, userId, date:dstr(0), startDate, dueDate, status:'진행중', formId,
    items:items.map(l=>({productId:l.productId,name:l.name,memo:l.memo,price:l.price,qty:l.qty})),
    buyItems};
  try{ const row=await dbIns('orders',o); orders.push(row); }catch(e){ return; }
  toast('주문을 저장했습니다');
  go('orders');
}

function renderOrderTable(){
  const st=document.getElementById('fStatus').value;
  const cl=parseInt(document.getElementById('fClient').value)||0;

async function toggleStatus(id){
  const o=orders.find(o=>o.id===id);
  const next=o.status==='완료'?'진행중':'완료';
  try{ await dbUpd('orders',id,{status:next}); }catch(e){ return; }
  o.status=next;
  renderOrderTable(); renderBell();
  toast(next==='완료'?'완료 처리했습니다':'진행중으로 변경했습니다');

async function delOrder(id){
  if(!confirm('이 주문을 삭제할까요?')) return;
  try{ await dbDel('orders',id); }catch(e){ return; }
  orders=orders.filter(o=>o.id!==id); renderOrderTable(); renderBell(); toast('삭제했습니다');
}

/* 견적서 이미지 복사 */
async function copyQuoteImage(){
  const doc=document.querySelector('#printArea .quote-doc');
  if(!doc){ toast('먼저 주문을 선택해 견적서를 생성하세요'); return; }
  const btn=document.getElementById('copyQuoteBtn');
  btn.disabled=true; btn.textContent='복사 중...';
  try{
    // 견적서 영역만 딱 맞게 캡처 (2배 해상도)
    const capture = () => html2canvas(doc,{scale:2, backgroundColor:'#ffffff', useCORS:true,
      onclone:(d)=>{ const q=d.querySelector('.quote-doc'); if(q){ q.style.boxShadow='none'; q.style.border='none'; q.style.margin='0'; } }
    });
    if(navigator.clipboard && window.ClipboardItem){
      // Safari 호환: Promise를 ClipboardItem에 직접 전달
      const blobPromise = capture().then(canvas=>new Promise(res=>canvas.toBlob(res,'image/png')));
      await navigator.clipboard.write([new ClipboardItem({'image/png': blobPromise})]);
      toast('견적서 이미지를 복사했습니다. 붙여넣기(Ctrl+V) 하세요!');
    }else{
      // 클립보드 미지원 브라우저 → 이미지 파일로 다운로드
      const canvas=await capture();
      const a=document.createElement('a');
      a.href=canvas.toDataURL('image/png');
      a.download='견적서.png'; a.click();
      toast('이 브라우저는 이미지 복사를 지원하지 않아 파일로 저장했습니다');
    }
  }catch(e){
    console.error(e);
    toast('복사에 실패했습니다. 다시 시도해주세요');
  }finally{
    btn.disabled=false; btn.textContent='📋 견적서 복사';
  }
}

async function saveForm(id){
  const name=document.getElementById('f_fname').value.trim();
  const note=document.getElementById('f_fnote').value;
  const isDefault=document.getElementById('f_fdefault').checked;
  if(!name){ toast('양식명을 입력하세요'); return; }
  try{
    if(isDefault){
      for(const f of quoteForms.filter(x=>x.isDefault&&x.id!==id)){ await dbUpd('quoteForms',f.id,{isDefault:false}); f.isDefault=false; }
    }
    if(id){ await dbUpd('quoteForms',id,{name,note,isDefault}); Object.assign(quoteForms.find(x=>x.id===id),{name,note,isDefault}); toast('양식을 수정했습니다'); }
    else{ const row=await dbIns('quoteForms',{name,note,isDefault}); quoteForms.push(row); toast('양식을 추가했습니다'); }
  }catch(e){ return; }
  closeModal(); renderForms();
}
async function setDefaultForm(id){
  try{
    for(const f of quoteForms.filter(x=>x.isDefault)){ await dbUpd('quoteForms',f.id,{isDefault:false}); f.isDefault=false; }
    await dbUpd('quoteForms',id,{isDefault:true}); quoteForms.find(x=>x.id===id).isDefault=true;
  }catch(e){ return; }
  renderForms(); toast('기본 양식으로 지정했습니다');
}
async function delForm(id){
  if(orders.some(o=>o.formId===id)){ toast('이 양식을 사용 중인 주문이 있어 삭제할 수 없습니다'); return; }
  if(!confirm('이 양식을 삭제할까요?')) return;
  try{ await dbDel('quoteForms',id); }catch(e){ return; }
  quoteForms=quoteForms.filter(f=>f.id!==id); renderForms(); toast('삭제했습니다');
}

  const v=document.getElementById('erpRange').value;
  const st=document.getElementById('erpStatus').value;
  let fromStr, toStr=ymd(today), chartKeys=[], chartMode='month';

  if(v==='7d'||v==='14d'||v==='1m'){
    const days = v==='7d'?7 : v==='14d'?14 : 30;
    fromStr=dstr(-(days-1));
    chartMode='day';
    for(let i=days-1;i>=0;i--) chartKeys.push(dstr(-i));
  }else if(v==='month'){
    const mo=document.getElementById('erpMonth').value || ymd(today).slice(0,7);
    fromStr=mo+'-01';
    const last=new Date(parseInt(mo.slice(0,4)), parseInt(mo.slice(5,7)), 0); // 해당 월 말일
    toStr=ymd(last);
    chartMode='day';
    for(let d=1;d<=last.getDate();d++) chartKeys.push(mo+'-'+String(d).padStart(2,'0'));
  }else{
    const months=parseInt(v);
    const from=new Date(today); from.setMonth(from.getMonth()-months+1); from.setDate(1);
    fromStr=ymd(from);
    for(let i=months-1;i>=0;i--){ const d=new Date(today); d.setDate(1); d.setMonth(d.getMonth()-i); chartKeys.push(ymd(d).slice(0,7)); }
  }
  let list=myOrders().filter(o=>o.date>=fromStr && o.date<=toStr);
  if(st) list=list.filter(o=>o.status===st);
  return {list, chartKeys, chartMode};
}
function drawErp(){
  const {list, chartKeys, chartMode}=erpFiltered();
  const total=list.reduce((s,o)=>s+orderTotal(o),0);
  const avg=list.length?Math.round(total/list.length):0;
  const clientIds=[...new Set(list.map(o=>o.clientId))];

  document.getElementById('erpStats').innerHTML=`
    <div class="stat"><div class="k">기간 총 매출</div><div class="v">${wonS(total)}<small> 원</small></div></div>
    <div class="stat"><div class="k">주문 건수</div><div class="v">${list.length}<small> 건</small></div></div>
    <div class="stat"><div class="k">건당 평균</div><div class="v">${wonS(avg)}<small> 원</small></div></div>
    <div class="stat"><div class="k">거래 거래처</div><div class="v">${clientIds.length}<small> 곳</small></div></div>`;

  /* 매출 추이 차트 (일별/월별 자동) */
  const byKey=chartKeys.map(k=> chartMode==='day'
    ? list.filter(o=>o.date===k).reduce((s,o)=>s+orderTotal(o),0)
    : list.filter(o=>o.date.startsWith(k)).reduce((s,o)=>s+orderTotal(o),0));
  const max=Math.max(...byKey,1);
  const labelStep = chartKeys.length>16 ? 5 : 1; // 막대가 많으면 라벨 간격 조정
  document.getElementById('erpChartTitle').textContent = chartMode==='day' ? '일별 매출 추이' : '월별 매출 추이';
  document.getElementById('erpChart').innerHTML=`
  <div class="bar-chart" style="gap:${chartKeys.length>16?'3px':'10px'}">
    ${chartKeys.map((k,i)=>{
      const lbl = chartMode==='day' ? parseInt(k.slice(8))+'일' : parseInt(k.slice(5))+'월';
      const tip = chartMode==='day' ? `${k.slice(5).replace('-','/')} · ${wonS(byKey[i])}원` : `${wonS(byKey[i])}원`;
      return `<div class="bar-col">
      <div class="bar" style="height:${Math.round(byKey[i]/max*160)}px"><span class="tip">${tip}</span></div>
      <div class="bar-lbl">${(i%labelStep===0||i===chartKeys.length-1)?lbl:''}</div>
    </div>`;}).join('')}
  </div>`;

  /* 거래처 순위 */
  const byClient=clientIds.map(cid=>({cid, total:list.filter(o=>o.clientId===cid).reduce((s,o)=>s+orderTotal(o),0), count:list.filter(o=>o.clientId===cid).length}))
    .sort((a,b)=>b.total-a.total);
  document.getElementById('erpRank').innerHTML = byClient.length ? `
  <table><thead><tr><th style="width:44px">순위</th><th>거래처</th><th>담당자</th><th class="num">매출</th><th class="num">건수</th><th style="width:110px">점유율</th></tr></thead><tbody>
  ${byClient.map((r,i)=>{
    const share=total?Math.round(r.total/total*100):0;
    const cl=clientOf(r.cid);
    return `<tr style="cursor:pointer" onclick="erpDetail(${r.cid})">
      <td><span class="rank-num ${i===0?'top':''}">${i+1}</span></td>
      <td><b>${esc(cl?.name||'-')}</b></td>
      <td>${cl?.userId?esc(userOf(cl.userId)?.name||'-'):'<span style="color:var(--muted)">미지정</span>'}</td>
      <td class="num">${wonS(r.total)}</td><td class="num">${r.count}</td>
      <td><span style="font-size:12px;font-weight:700">${share}%</span><div class="share-bar"><i style="width:${share}%"></i></div></td>
    </tr>`;
  }).join('')}
  </tbody></table>` : '<div class="empty">기간 내 매출 데이터가 없습니다.</div>';

  drawSettle(list);
  if(settleSelUser && (currentUser.role==='admin'||settleSelUser===currentUser.id)) settleDetail(settleSelUser);
}

const settleAmt = (margin, rate) => Math.round(margin * (rate||0) / 100);
function drawSettle(list){
  const isAdmin=currentUser.role==='admin';
  const staff=(isAdmin?users:[currentUser]).map(u=>{
    const mine=list.filter(o=>o.userId===u.id);
    const sales=mine.reduce((s,o)=>s+orderTotal(o),0);
    const cost=mine.reduce((s,o)=>s+orderCost(o),0);
    const margin=sales-cost;
    return {u, count:mine.length, sales, cost, margin, settle:settleAmt(margin,u.rate)};
  }).sort((a,b)=>b.settle-a.settle);

  document.getElementById('erpSettle').innerHTML = staff.some(r=>r.count) ? `

    <td class="num">${wonS(r.sales)}</td>
    <td class="num" style="color:var(--amber)">${wonS(r.cost)}</td>
    <td class="num ${r.margin>=0?'margin-pos':'margin-neg'}" style="font-weight:700">${wonS(r.margin)}</td>
    <td class="num"><b>${r.u.rate||0}%</b></td>
    <td class="num" style="font-weight:800;color:var(--primary)">${wonS(r.settle)}</td>
    ${isAdmin?`<td style="text-align:right"><button class="mini-btn" onclick="event.stopPropagation();rateForm(${r.u.id})">정산율</button></td>`:''}

function exportExcel(){
  const from=document.getElementById('xl_from').value;
  const to=document.getElementById('xl_to').value;
  const st=document.getElementById('xl_status').value;
  const staffId=currentUser.role==='admin' ? (parseInt(document.getElementById('xl_staff').value)||0) : currentUser.id;
  if(!from||!to){ toast('기간을 선택하세요'); return; }
  if(to<from){ toast('종료일은 시작일 이후여야 합니다'); return; }
  if(typeof XLSX==='undefined'){ toast('엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요'); return; }
  let list=myOrders().filter(o=>o.date>=from&&o.date<=to);
  if(st) list=list.filter(o=>o.status===st);
  if(staffId) list=list.filter(o=>o.userId===staffId);
  if(!list.length){ toast('해당 기간에 주문이 없습니다'); return; }
  list=[...list].sort((a,b)=>a.date.localeCompare(b.date));

  /* 시트1: 주문 내역 (정산금 = 해당 주문 마진 × 담당자 정산율) */
  const rows1=[['등록일','거래처','담당자','품목','시작일','마감일','공급가','원가','마진','부가세','합계','정산금']];
  list.forEach(o=>{
    const u=userOf(o.userId);
    const sales=orderTotal(o), cost=orderCost(o), margin=sales-cost, vat=Math.round(sales*0.1);
    rows1.push([o.date, clientOf(o.clientId)?.name||'-', u?.name||'-',
      o.items.map(i=>`${i.name} x${i.qty}`).join(', '),
      o.startDate, o.dueDate, sales, cost, margin, vat, sales+vat, settleAmt(margin, u?.rate)]);
  });
  const tSales=list.reduce((s,o)=>s+orderTotal(o),0), tCost=list.reduce((s,o)=>s+orderCost(o),0);
  const tSettle=list.reduce((s,o)=>s+settleAmt(orderMargin(o), userOf(o.userId)?.rate),0);
  rows1.push([]);
  rows1.push(['합계','','','','','',tSales,tCost,tSales-tCost,Math.round(tSales*0.1),tSales+Math.round(tSales*0.1),tSettle]);

  /* 시트2: 직원별 정산 */
  const staffIds=[...new Set(list.map(o=>o.userId))];
  const rows2=[['직원','정산율(%)','주문 건수','매출','원가','마진','정산금']];
  staffIds.map(uid=>{
    const u=userOf(uid);
    const mine=list.filter(o=>o.userId===uid);
    const sales=mine.reduce((s,o)=>s+orderTotal(o),0);
    const cost=mine.reduce((s,o)=>s+orderCost(o),0);
    return {u, count:mine.length, sales, cost, margin:sales-cost};
  }).sort((a,b)=>b.margin-a.margin).forEach(r=>{
    rows2.push([r.u?.name||'-', r.u?.rate||0, r.count, r.sales, r.cost, r.margin, settleAmt(r.margin, r.u?.rate)]);
  });

  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(rows1);
  ws1['!cols']=[{wch:11},{wch:16},{wch:9},{wch:38},{wch:11},{wch:11},{wch:13},{wch:12},{wch:12},{wch:12},{wch:14},{wch:12}];
  const ws2=XLSX.utils.aoa_to_sheet(rows2);
  ws2['!cols']=[{wch:10},{wch:9},{wch:9},{wch:13},{wch:12},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws1, '주문내역');
  XLSX.utils.book_append_sheet(wb, ws2, '직원별정산');
  const staffTag = staffId ? `_${userOf(staffId)?.name||''}` : '';
  XLSX.writeFile(wb, `루폰스_매출정산${staffTag}_${from.replace(/-/g,'')}-${to.replace(/-/g,'')}.xlsx`);
  closeModal(); toast('엑셀 파일을 다운로드했습니다');
}

      <div class="field"><label>정산율 (%)</label><input id="f_urate" type="number" min="0" max="100" value="${u.rate||0}"></div>
    </div>
    <div style="font-size:12px;color:var(--muted)">연락처와 kakao는 이 담당자가 등록한 주문의 견적서에 표시됩니다. 비워두면 견적서에도 공란으로 나갑니다.</div>
  </div>
  <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="saveUser(${uid||0})">${uid?'저장':'생성'}</button></div>`);
}
async function saveUser(uid){
  const name=document.getElementById('f_uname').value.trim();
  const id2=document.getElementById('f_uid').value.trim();
  const pw=document.getElementById('f_upw').value;
  const role=document.getElementById('f_urole').value;
  const phone=document.getElementById('f_uphone').value.trim();
  const kakao=document.getElementById('f_ukakao').value.trim();
  const rate=Math.min(100,Math.max(0,parseInt(document.getElementById('f_urate').value)||0));
  if(!name){ toast('이름을 입력하세요'); return; }
  try{
    if(uid){
      const patch={name, role, rate, phone, kakao};
      if(pw) patch.pw=pw;
      await dbUpd('users',uid,patch);
      Object.assign(userOf(uid),patch);
      toast('계정 정보를 수정했습니다');
    }else{
      if(!id2||!pw){ toast('아이디와 비밀번호를 입력하세요'); return; }
      if(users.some(u=>u.username===id2)){ toast('이미 사용 중인 아이디입니다'); return; }
      const row=await dbIns('users',{username:id2, pw, name, role, rate, phone, kakao});
      users.push(row);
      toast('계정을 생성했습니다');
    }
  }catch(e){ return; }
  closeModal(); renderUsers();
}
async function delUser(id){
  if(orders.some(o=>o.userId===id)){ toast('주문 이력이 있는 계정은 삭제할 수 없습니다'); return; }
  if(!confirm('이 계정을 삭제할까요?')) return;
  try{ await dbDel('users',id); }catch(e){ return; }
  users=users.filter(u=>u.id!==id); renderUsers(); toast('삭제했습니다');
}
</script>
</body>
</html>
